<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <filter id="faqCardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#f8fafc" />

  <!-- Title & Header -->
  <g transform="translate(0, 45)" text-anchor="middle">
    <!-- Pill badge -->
    <rect x="330" y="0" width="140" height="26" rx="13" fill="#e0e7ff" />
    <text x="400" y="17" fill="#4338ca" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1">HELP &amp; SUPPORT</text>

    <!-- Main Title -->
    <text x="400" y="55" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800">Frequently Asked Questions</text>
    <text x="400" y="80" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Find fast answers to common questions about shipping, returns, and orders.</text>
  </g>

  <!-- Search Bar Mockup -->
  <g transform="translate(230, 150)">
    <rect width="340" height="40" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <circle cx="25" cy="20" r="6" fill="none" stroke="#94a3b8" stroke-width="2" />
    <line x1="29.5" y1="24.5" x2="35" y2="30" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <text x="45" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Type to search questions...</text>
  </g>

  <!-- FAQ List Items -->
  <g transform="translate(160, 210)" filter="url(#faqCardShadow)">
    <!-- Item 1 (Expanded) -->
    <rect width="480" height="96" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5" />
    <text x="24" y="30" fill="#1e1b4b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">What is your shipping time and return policy?</text>
    <circle cx="445" cy="25" r="13" fill="#4f46e5" />
    <!-- Chevron Up -->
    <path d="M441 27 L445 23 L449 27" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Expanded answer text -->
    <text x="24" y="58" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">We provide 2-4 days express delivery across all US &amp; EU locations.</text>
    <text x="24" y="78" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Every order comes backed with our 30-day no-questions-asked refund guarantee.</text>

    <!-- Item 2 (Collapsed) -->
    <g transform="translate(0, 110)">
      <rect width="480" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="24" y="31" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Can I modify or cancel my order after placing it?</text>
      <circle cx="445" cy="26" r="13" fill="#f1f5f9" />
      <path d="M441 24 L445 28 L449 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Item 3 (Collapsed) -->
    <g transform="translate(0, 172)">
      <rect width="480" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="24" y="31" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Do you offer international customs-free delivery?</text>
      <circle cx="445" cy="26" r="13" fill="#f1f5f9" />
      <path d="M441 24 L445 28 L449 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
