<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#f8fafc" />

  <g transform="translate(0, 100)" text-anchor="middle">
    <text x="400" y="20" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1">TRUST &amp; CREDIBILITY</text>
    <text x="400" y="55" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800">Velroxa Trust Bar</text>
    <text x="400" y="78" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Highlighting guarantees, fast shipping, and customer support with icons</text>
  </g>

  <!-- Horizontal Trust Bar -->
  <g transform="translate(60, 240)">
    <rect width="680" height="96" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Item 1 -->
    <g transform="translate(30, 24)">
      <circle cx="24" cy="24" r="22" fill="#eff6ff" />
      <text x="14" y="30" font-size="18">🚚</text>
      <text x="56" y="20" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Free Express Delivery</text>
      <text x="56" y="36" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">On all orders over $75</text>
    </g>

    <!-- Divider -->
    <line x1="250" y1="20" x2="250" y2="76" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- Item 2 -->
    <g transform="translate(270, 24)">
      <circle cx="24" cy="24" r="22" fill="#f0fdf4" />
      <text x="14" y="30" font-size="18">🛡️</text>
      <text x="56" y="20" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">30-Day Guarantee</text>
      <text x="56" y="36" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">100% money back guarantee</text>
    </g>

    <!-- Divider -->
    <line x1="480" y1="20" x2="480" y2="76" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- Item 3 -->
    <g transform="translate(500, 24)">
      <circle cx="24" cy="24" r="22" fill="#fef3c7" />
      <text x="14" y="30" font-size="18">💬</text>
      <text x="56" y="20" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">24/7 Expert Support</text>
      <text x="56" y="36" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Real humans ready to assist</text>
    </g>
  </g>
</svg>
