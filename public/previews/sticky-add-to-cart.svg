<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <filter id="stickyShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="-4" stdDeviation="12" flood-color="#000" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#f1f5f9" />

  <!-- Simulated Store Page in background -->
  <g transform="translate(60, 30)">
    <rect width="680" height="260" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <!-- Product image area -->
    <rect x="25" y="25" width="220" height="210" rx="8" fill="#e2e8f0" />
    <circle cx="135" cy="130" r="40" fill="#cbd5e1" />
    <path d="M100 150 C120 120, 150 120, 170 150" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

    <!-- Product description lines -->
    <rect x="270" y="35" width="260" height="20" rx="4" fill="#0f172a" />
    <rect x="270" y="70" width="120" height="16" rx="4" fill="#10b981" />
    <rect x="270" y="105" width="360" height="10" rx="3" fill="#cbd5e1" />
    <rect x="270" y="125" width="340" height="10" rx="3" fill="#cbd5e1" />
    <rect x="270" y="145" width="280" height="10" rx="3" fill="#cbd5e1" />
    <rect x="270" y="180" width="180" height="40" rx="6" fill="#0f172a" />
  </g>

  <!-- Floating Sticky Bar (Anchored at bottom) -->
  <g transform="translate(0, 340)" filter="url(#stickyShadow)">
    <rect width="800" height="110" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Product Mini Info -->
    <rect x="60" y="22" width="60" height="60" rx="8" fill="#e2e8f0" />
    <circle cx="90" cy="52" r="14" fill="#94a3b8" />

    <text x="135" y="46" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Aura Pro Series Wireless Earbuds</text>
    <text x="135" y="70" fill="#059669" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="800">$149.00</text>
    <text x="210" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-decoration="line-through">$199.00</text>

    <!-- Controls -->
    <!-- Variant dropdown mockup -->
    <rect x="460" y="32" width="130" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="475" y="58" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">Matte Black</text>
    <path d="M570 54 L575 59 L580 54" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Add to cart CTA -->
    <rect x="605" y="32" width="135" height="42" rx="6" fill="#0f172a" />
    <text x="632" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Add to Cart ⚡</text>
  </g>
</svg>
