<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="450" fill="#ffffff" />

  <!-- Header -->
  <g transform="translate(0, 110)" text-anchor="middle">
    <rect x="325" y="0" width="150" height="26" rx="13" fill="#f1f5f9" />
    <text x="400" y="17" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" letter-spacing="1">TRUST BADGES</text>
    <text x="400" y="55" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800">Featured in Top Publications</text>
    <text x="400" y="80" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Seamless infinite marquee displaying partner and press logos</text>
  </g>

  <!-- Marquee Container -->
  <g transform="translate(50, 240)">
    <rect width="700" height="90" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />

    <!-- Brand Names / Logos in grayscale -->
    <g transform="translate(30, 52)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" fill="#475569">
      <text x="20" y="0" font-size="22" letter-spacing="2">Forbes</text>
      <text x="145" y="0" font-size="21" letter-spacing="-1">TechCrunch</text>
      <text x="300" y="0" font-size="23" font-style="italic">VOGUE</text>
      <text x="415" y="0" font-size="21" letter-spacing="3">WIRED</text>
      <text x="535" y="0" font-size="22">Bloomberg</text>
    </g>
  </g>

  <!-- Dots & Indicators -->
  <g transform="translate(370, 360)">
    <circle cx="10" cy="0" r="4" fill="#94a3b8" />
    <circle cx="30" cy="0" r="4" fill="#cbd5e1" />
    <circle cx="50" cy="0" r="4" fill="#cbd5e1" />
  </g>
</svg>

