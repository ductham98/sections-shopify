<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#fdfbf7" />

  <g transform="translate(0, 45)" text-anchor="middle">
    <text x="400" y="20" fill="#d97706" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1">HELP DESK</text>
    <text x="400" y="55" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800">FAQ + Direct Contact</text>
    <text x="400" y="78" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Answers to top questions paired with a native Shopify contact inquiry form</text>
  </g>

  <!-- Split Layout: Left Accordion, Right Contact Form -->
  <g transform="translate(60, 130)">
    <!-- Left Column: FAQ Accordion -->
    <g transform="translate(0, 0)">
      <rect width="320" height="250" rx="12" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.2" />
      <g transform="translate(20, 24)">
        <text x="0" y="10" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Frequently Asked</text>
        <line x1="0" y1="24" x2="280" y2="24" stroke="#f4f4f5" stroke-width="1" />
        
        <!-- Accordion 1 -->
        <g transform="translate(0, 40)">
          <text x="0" y="0" fill="#18181b" font-size="12" font-weight="600">Can I track my shipment?</text>
          <text x="260" y="0" fill="#71717a" font-size="12">−</text>
          <text x="0" y="18" fill="#71717a" font-size="10">Yes, tracking links are sent via email.</text>
        </g>
        
        <!-- Accordion 2 -->
        <g transform="translate(0, 85)">
          <line x1="0" y1="-8" x2="280" y2="-8" stroke="#f4f4f5" stroke-width="1" />
          <text x="0" y="8" fill="#18181b" font-size="12" font-weight="600">What is the return period?</text>
          <text x="260" y="8" fill="#71717a" font-size="12">+</text>
        </g>
        
        <!-- Accordion 3 -->
        <g transform="translate(0, 130)">
          <line x1="0" y1="-8" x2="280" y2="-8" stroke="#f4f4f5" stroke-width="1" />
          <text x="0" y="8" fill="#18181b" font-size="12" font-weight="600">Are duties and taxes included?</text>
          <text x="260" y="8" fill="#71717a" font-size="12">+</text>
        </g>
      </g>
    </g>

    <!-- Right Column: Contact Form -->
    <g transform="translate(360, 0)">
      <rect width="320" height="250" rx="12" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.2" />
      <g transform="translate(20, 24)">
        <text x="0" y="10" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Send Us a Message</text>
        
        <rect x="0" y="32" width="280" height="30" rx="6" fill="#f4f4f5" />
        <text x="12" y="52" fill="#a1a1aa" font-size="11">Your Name</text>

        <rect x="0" y="72" width="280" height="30" rx="6" fill="#f4f4f5" />
        <text x="12" y="92" fill="#a1a1aa" font-size="11">Your Email</text>

        <rect x="0" y="112" width="280" height="50" rx="6" fill="#f4f4f5" />
        <text x="12" y="132" fill="#a1a1aa" font-size="11">How can we help?</text>

        <rect x="0" y="172" width="280" height="32" rx="6" fill="#18181b" />
        <text x="105" y="193" fill="#ffffff" font-size="11" font-weight="700">Submit Inquiry →</text>
      </g>
    </g>
  </g>
</svg>

